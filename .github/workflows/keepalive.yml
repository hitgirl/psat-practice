# Keeps the free Supabase project from pausing (it pauses after ~7 days
# without activity, and there can be days between practice tests).
# Once a day this runs a harmless read against the database. It also re-enables
# itself, because GitHub turns off scheduled jobs in repos with no commits for 60 days.
name: Keep database awake

on:
  schedule:
    - cron: "17 14 * * *" # daily, 14:17 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query the database
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js)
          KEY=$(grep -o 'sb_publishable_[A-Za-z0-9_-]*' config.js)
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/get_attempts" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{"p_token":"keepalive-ping-not-a-real-code"}')
            echo "HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 30
          done
          echo "::error::Database didn't answer. If the Supabase project is paused, restore it from the Supabase dashboard."
          exit 1
      - name: Keep this daily job enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
